
name: Build Dice Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle 8.13
        working-directory: DiceAssistantAndroid
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x gradlew


      - name: Diagnose Gradle
        working-directory: DiceAssistantAndroid
        run: |
          echo "=== GRADLE WRAPPER PROPERTIES ==="
          cat gradle/wrapper/gradle-wrapper.properties

          echo "=== GRADLE SCRIPT ==="
          head -n 20 gradlew

          echo "=== GRADLE VERSION ==="
          ./gradlew --version


      - name: Build APK
        working-directory: DiceAssistantAndroid
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiceAssistant-APK
          path: DiceAssistantAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
